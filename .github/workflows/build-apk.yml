name: Build Fossify APK with API Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Clean build cache
        run: |
          chmod +x ./gradlew
          ./gradlew clean --no-daemon
          rm -rf .gradle/caches/transforms-* .gradle/caches/modules-*

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fossify-api-debug
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Fossify API APK ${{ github.ref }}
          body: |
            Fossify Messages APK with integrated API Server for SMS bridge control.

            **Features:**
            - NanoHTTPD API server on port 8080
            - SMS/MMS sending via HTTP endpoints
            - Webhook notifications for received messages
            - Compatible with SMS Bridge Linphone
          draft: false
          prerelease: false
